server:
  port: 8080

spring:
  profiles:
    active: local

  datasource:
    # Render Blueprint: DB_HOST/DB_PORT/DB_NAME 由 fromDatabase 自动注入 → 拼接 PostgreSQL
    # 本地开发: application-local.yml 覆盖为 MySQL
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campus_trading}?sslmode=require}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    # 不写死驱动, Spring 根据 JDBC URL 自动选择 (MySQL/PostgreSQL)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# JWT 配置
jwt:
  secret: ${JWT_SECRET:campus-trading-default-secret-change-in-production}
  expiration: 604800000  # 7天

# 文件上传路径
file:
  upload:
    path: ./uploads/
