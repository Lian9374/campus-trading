server:
  port: 8080

spring:
  profiles:
    active: local

  datasource:
    # 本地默认 MySQL; Render 部署时设置 DB_URL 指向 PostgreSQL
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_trading?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    # 不写死驱动, Spring 根据 JDBC URL 自动选择 (MySQL/PostgreSQL)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# JWT 配置
jwt:
  secret: ${JWT_SECRET:campus-trading-default-secret-change-in-production}
  expiration: 604800000  # 7天

# 文件上传路径
file:
  upload:
    path: ./uploads/
