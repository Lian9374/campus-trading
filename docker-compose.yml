services:
  mysql:
    image: mysql:8
    container_name: campus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-MyPass123}
      MYSQL_DATABASE: campus_trading
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: campus-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campus_trading?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-MyPass123}
      JWT_SECRET: ${JWT_SECRET:-campus-trading-jwt-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: campus-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
