# Nginx 模板 — 启动时由环境变量 BACKEND_HOST 替换
# 本地/容器: 设 BACKEND_HOST=http://backend:8080
# Railway:   BACKEND_HOST=http://<service>.railway.internal:8080
# Render:    BACKEND_HOST=http://<backend-service>.onrender.com
server {
    listen 80;
    server_name _;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 代理 API 到后端
    location /api/ {
        proxy_pass ${BACKEND_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 代理上传文件
    location /uploads/ {
        proxy_pass ${BACKEND_HOST};
    }
}
