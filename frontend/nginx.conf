# Railway 专用：backend 服务通过私有网络域名互访
# 注意：本地 docker-compose 用仓库根的 nginx.conf (proxy_pass http://backend:8080)
server {
    listen 80;
    server_name _;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 代理 API 到后端（Railway 私有网络域名）
    location /api/ {
        proxy_pass http://backend.railway.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 代理上传文件
    location /uploads/ {
        proxy_pass http://backend.railway.internal:8080;
    }
}
